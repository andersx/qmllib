[build-system]
requires = ["scikit-build-core>=0.9", "pybind11", "setuptools"]
build-backend = "scikit_build_core.build"

[project]
name = "qmllib"
dynamic = ["version"]
authors = []
description="Python/Fortran toolkit for representation of molecules and solids for machine learning of properties of molecules and solids."
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
]
keywords = ["qml", "quantum chemistry", "machine learning"]
readme="README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.00",   # required at runtime
    "scipy>=1.10",  # required at runtime
]


[project.optional-dependencies]
test = ["pytest>=8", "pytest-xdist", "pytest-cov", "pytest-timeout"]
dev = [
    "ruff>=0.8.0",
    "ty>=0.0.1",
    "pre-commit>=3.6.0",
]

[project.urls]
Homepage = "https://qmlcode.org"
Issues = "https://github.com/qmlcode/qmllib/issues"

[tool.scikit-build]
wheel.expand-macos-universal-tags = true
wheel.py-api = "py3"
cmake.build-type = "Release"
cmake.verbose = true
wheel.packages = ["python/kernelforge"]

# optional: put compiled outputs under build/{tag}/ to avoid clashes
# build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
CMAKE_VERBOSE_MAKEFILE = "ON"
CMAKE_BUILD_TYPE = "Release"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade (modern Python syntax)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["qmllib"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N803", "N806", "B017", "B023", "C408", "E501", "E402", "SIM115", "SIM113"]  # Allow test-specific patterns
# Mathematical notation: Allow uppercase variables (A, B, K, X1, X2, SIGMA, etc.) in kernel/distance code
# Also allow function calls in defaults (B008) for mathematical constants like sqrt(2)
# Allow ambiguous variable names (E741) like 'l' for mathematical indices
"src/qmllib/kernels/*" = ["N803", "N806", "E501"]
"src/qmllib/representations/*" = ["N803", "N806", "E501", "B008", "E741"]
"src/qmllib/solvers/*" = ["N803", "N806", "E501"]
"src/qmllib/utils/alchemy.py" = ["N802"]  # QNum_distance follows domain naming convention

[tool.ty]
# Note: Type checking configured for scientific code with extensive Fortran extensions
# This codebase interfaces extensively with Fortran/C code which lacks type information
# ty is configured to be pragmatic about type checking in this context

[tool.ty.environment]
root = ["src"]

# Ignore common issues with Fortran/C extension modules
# These can be fixed incrementally by improving type annotations
[tool.ty.rules]
# Fortran extension modules don't have type stubs
unresolved-import = "ignore"
# Type mismatches common with numpy arrays and Fortran code
invalid-assignment = "ignore"
invalid-argument-type = "ignore"
invalid-parameter-default = "ignore"
no-matching-overload = "ignore"
unresolved-attribute = "ignore"
